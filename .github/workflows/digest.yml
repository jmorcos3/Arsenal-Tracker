name: Arsenal Digest

on:
  schedule:
    # 16:17 UTC every 3 days = ~12:17pm ET during EDT, ~11:17am ET during EST.
    - cron: '17 16 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Build and send digest
        id: digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DIGEST_TO: jmorcos3@gmail.com
          DIGEST_FROM: jmorcos3@gmail.com
        run: python scripts/digest.py

      - name: Commit updated tracker data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): auto-update from digest run"
            git push
          fi

      - name: Notify on unhandled failure
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: jmorcos3@gmail.com
          DIGEST_FROM: jmorcos3@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
