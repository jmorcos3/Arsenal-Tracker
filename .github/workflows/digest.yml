name: Arsenal Digest

on:
  schedule:
    # Daily at 12:17 UTC = 8:17am EDT / 7:17am EST. digest.py sends only on the
    # day after Arsenal play (any competition); other days it refreshes the
    # site data and stops before the news and email steps.
    - cron: '17 12 * * *'
  # A manual run always sends, match or not.
  workflow_dispatch:

permissions:
  contents: write

# A manual run started while the scheduled one is going would race it to push
# the same data files; queue it instead.
concurrency:
  group: arsenal-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # A normal run takes about two minutes; don't let a hung request hold a
    # runner for the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Build and send digest
        id: digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: jmorcos3@gmail.com
          DIGEST_FROM: jmorcos3@gmail.com
          DIGEST_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/digest.py

      # Runs even when the digest step failed. Odds, tactics, fixtures, standing
      # and transfers are all written to data/ before the email is attempted, so
      # a bad SMTP credential shouldn't also freeze the website. Nothing is
      # staged if the run died before writing anything.
      - name: Commit updated tracker data
        if: '!cancelled()'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): auto-update from digest run"
            # The branch can move while the run is in flight (a merged PR, say);
            # replay the data commit on top rather than fail the push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Only when digest.py never got far enough to report the error itself —
      # it drops .failure-notified when it sends its own alert.
      - name: Notify on unhandled failure
        if: failure() && hashFiles('.failure-notified') == ''
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: jmorcos3@gmail.com
          DIGEST_FROM: jmorcos3@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
